# Copy this file to config.yaml (ignored by git) and fill in your own values.

#! Bot data
name: Selenne
version: Selenium 5 (Block Version)
prefix: s.
# Discord bot token. Prefer the SELENNE_TOKEN environment variable over writing it here.
TOKEN: YOUR_DISCORD_BOT_TOKEN

# Discord user ID of the bot owner (or set SELENNE_OWNER_ID).
owner: 0
warn_on_ready: False

#! Visible Config
description: Selenne
activity: DCS
status: Online

color: 0xfe2a9b
colours:
  red: blue

#! Databases
databases:
  host: localhost
  username: root
  password: ''  # or set SELENNE_DB_PASSWORD
  database: selenium

LocalDatabase: .\LDB

#! Extensions
extensions:
  - extension.system.DatabaseManager
  - extension.system.BotStats
  - extension.AdminTools
  - extension.essentials
  - extension.custom.DAM
